name: mac build

# 서명·공증 없는 ad-hoc 빌드. 첫 실행 시 Gatekeeper 경고가 뜨고 자동 업데이트는 동작하지 않는다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '빌드 버전 (예: 1.0.33-personal)'
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ORCA_FORK_PUBLISH_OWNER: yoush0111
      ORCA_FORK_PUBLISH_REPO: orca
      ORCA_LOCAL_BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 빌드가 git describe로 upstream 릴리즈 태그를 찾는데 포크에는 v1.4.* 태그가 없다.
      - run: git fetch --no-tags https://github.com/stablyai/orca.git 'refs/tags/v1.4.*:refs/tags/v1.4.*'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: pnpm run build:desktop
      - run: pnpm run build:computer-macos
      - run: pnpm run build:keyboard-layout-macos
      - run: pnpm run build:notification-status-macos
      - run: pnpm run ensure:electron-runtime
      - run: pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: orca-mac-${{ matrix.arch }}-${{ inputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
