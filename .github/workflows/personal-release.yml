name: Personal Release

# ponytail: unsigned, single-platform (Windows) release for a private personal
# fork. Builds on tag push and publishes to the public yoush0111/orca-releases
# repo so binaries are shareable without exposing source. Upgrade path if
# signing/mac builds are ever needed: borrow the mac/signing legs from
# release-mac-build.yml and dev-channel-win-build.yml.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:win

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe \
            --repo yoush0111/orca-releases \
            --title "${{ github.ref_name }}" \
            --notes "Automated build from private source, unsigned."
