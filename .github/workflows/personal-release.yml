name: Personal Release

# ponytail: unsigned, single-platform (Windows) release for a private personal
# fork. Builds on tag push and publishes to the public yoush0111/orca-releases
# repo so binaries are shareable without exposing source. Upgrade path if
# signing/mac builds are ever needed: borrow the mac/signing legs from
# release-mac-build.yml and dev-channel-win-build.yml.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:desktop
      - run: pnpm run ensure:electron-runtime
      # electron-builder auto-publishes on a git tag by default (targets
      # stablyai/orca); disabled since we publish to orca-releases ourselves below.
      # Run directly (not via the pnpm script) so --publish=never reaches it —
      # `pnpm run build:win -- --publish=never` did not forward through the
      # chained (&&) script.
      # Why ORCA_LOCAL_BUILD_VERSION: without it every build ships package.json's
      # version, so latest.yml reports the same version each release and
      # electron-updater never sees a newer one. Derived from the tag (v prefix
      # stripped) so the app version and the release tag always agree.
      - shell: bash
        env:
          ORCA_FORK_PUBLISH_OWNER: yoush0111
          ORCA_FORK_PUBLISH_REPO: orca-releases
        run: |
          export ORCA_LOCAL_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          npx electron-builder --config config/electron-builder.config.cjs --win --publish=never

      - name: Publish to public releases repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe dist/latest.yml \
            --repo yoush0111/orca-releases \
            --title "${{ github.ref_name }}" \
            --notes "Automated build from private source, unsigned."
